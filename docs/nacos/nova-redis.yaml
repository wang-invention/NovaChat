spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${NOVA_REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      client-type: lettuce
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s
        shutdown-timeout: 100ms
