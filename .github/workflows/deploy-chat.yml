name: Deploy Chat Service

permissions:
  packages: write
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'nova-chat/**'
      - 'nova-common/**'
  workflow_dispatch:

env:
  REGISTRY_PUSH: docker.cnb.cool
  REGISTRY_PULL: docker.cnb.cool
  IMAGE_NAME: wang.ux/nova-chat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean install -DskipTests -pl .,nova-common -am
          cd nova-chat
          mvn clean package spring-boot:repackage -DskipTests

      - name: Login to cnb.cool registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY_PUSH }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_PUSH }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: nova-chat
          file: nova-chat/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create namespace if not exists
        run: kubectl create namespace novachat || true

      - name: Deploy to k3s
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nova-chat
            namespace: novachat
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: nova-chat
            template:
              metadata:
                labels:
                  app: nova-chat
              spec:
                containers:
                - name: nova-chat
                  image: ${{ env.REGISTRY_PULL }}/${{ env.IMAGE_NAME }}:latest
                  ports:
                  - containerPort: 30000
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "768Mi"
                      cpu: "500m"
                  livenessProbe:
                    tcpSocket:
                      port: 30000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    tcpSocket:
                      port: 30000
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nova-chat
            namespace: novachat
          spec:
            type: ClusterIP
            selector:
              app: nova-chat
            ports:
            - port: 30000
              targetPort: 30000
          EOF

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nova-chat -n novachat --timeout=120s
          kubectl get pods -n novachat -l app=nova-chat