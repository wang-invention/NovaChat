name: Deploy User Service

permissions:
  packages: write
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'nova-user/**'
      - 'nova-common/**'
  workflow_dispatch:

env:
  REGISTRY_PUSH: 129.211.0.210:15000
  REGISTRY_PULL: 192.168.1.101:5000
  IMAGE_NAME: wangfaming666/nova-user

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean install -DskipTests -pl nova-common
          mvn clean package -DskipTests -pl nova-user -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_PUSH }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: nova-user
          file: nova-user/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PUSH }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create namespace if not exists
        run: kubectl create namespace novachat || true

      - name: Deploy to k3s
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nova-user
            namespace: novachat
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nova-user
            template:
              metadata:
                labels:
                  app: nova-user
              spec:
                containers:
                - name: nova-user
                  image: ${{ env.REGISTRY_PULL }}/${{ env.IMAGE_NAME }}:latest
                  ports:
                  - containerPort: 8001
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "768Mi"
                      cpu: "500m"
                  livenessProbe:
                    tcpSocket:
                      port: 8001
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    tcpSocket:
                      port: 8001
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nova-user
            namespace: novachat
          spec:
            type: ClusterIP
            selector:
              app: nova-user
            ports:
            - port: 8001
              targetPort: 8001
          EOF

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nova-user -n novachat --timeout=120s
          kubectl get pods -n novachat -l app=nova-user