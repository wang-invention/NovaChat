name: Deploy Gateway


permissions:
  packages: write
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'nova-gateway/**'
      - 'nova-common/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME:  wang-invention/nova-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean install -DskipTests -pl nova-common
          mvn clean package -DskipTests -pl nova-gateway -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: nova-gateway
          dockerfile: nova-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to k3s
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nova-gateway
            namespace: novachat
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nova-gateway
            template:
              metadata:
                labels:
                  app: nova-gateway
              spec:
                containers:
                - name: nova-gateway
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  ports:
                  - containerPort: 8087
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "768Mi"
                      cpu: "500m"
                  livenessProbe:
                    tcpSocket:
                      port: 8087
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    tcpSocket:
                      port: 8087
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nova-gateway
            namespace: novachat
          spec:
            type: NodePort
            selector:
              app: nova-gateway
            ports:
            - port: 8087
              targetPort: 8087
              nodePort: 30087
          EOF

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nova-gateway -n novachat --timeout=120s
          kubectl get pods -n novachat -l app=nova-gateway
