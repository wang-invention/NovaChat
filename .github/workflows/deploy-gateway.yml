name: Deploy Gateway

permissions:
  packages: write
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'nova-gateway/**'
      - 'nova-common/**'
  workflow_dispatch:

env:
  REGISTRY_PUSH: docker.cnb.cool
  REGISTRY_PULL: docker.cnb.cool
  IMAGE_NAME: wang.ux/nova-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean install -DskipTests -pl .,nova-common
          cd nova-gateway
          mvn clean package spring-boot:repackage -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 👇 登录 cnb.cool（必须开启）
      - name: Login to cnb.cool registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_PUSH }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 👇 删除旧的 insecure registry 配置
      # - name: Allow insecure registry
      #   run: |
      #     echo '{"insecure-registries": ["${{ env.REGISTRY_PUSH }}"]}' | sudo tee /etc/docker/daemon.json
      #     sudo systemctl restart docker

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: nova-gateway
          file: nova-gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PUSH }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create namespace if not exists
        run: kubectl create namespace novachat || true

      - name: Deploy to k3s
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nova-gateway
            namespace: novachat
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nova-gateway
            template:
              metadata:
                labels:
                  app: nova-gateway
              spec:
                containers:
                - name: nova-gateway
                  image: ${{ env.REGISTRY_PULL }}/${{ env.IMAGE_NAME }}:latest
                  ports:
                  - containerPort: 8087
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "768Mi"
                      cpu: "500m"
                  livenessProbe:
                    tcpSocket:
                      port: 8087
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    tcpSocket:
                      port: 8087
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nova-gateway
            namespace: novachat
          spec:
            type: NodePort
            selector:
              app: nova-gateway
            ports:
            - port: 8087
              targetPort: 8087
              nodePort: 30087
          EOF

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nova-gateway -n novachat --timeout=120s
          kubectl get pods -n novachat -l app=nova-gateway