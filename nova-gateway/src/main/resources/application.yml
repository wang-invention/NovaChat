server:
  port: 8080
  address: 0.0.0.0

spring:


  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: nova-user
          uri: lb://nova-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2

        - id: nova-chat
          uri: lb://nova-chat
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=2

        - id: nova-ai
          uri: http://129.211.0.210:8000
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2


          
nova:
  # JWT 密钥须与 nova-user 一致，否则签名校验通不过
  jwt:
    secret: ${NOVA_JWT_SECRET:nova-chat-jwt-secret-change-me-in-production-2026}
    expire-seconds: 604800
    issuer: nova-chat

  auth:
    enabled: true
    # Ant 路径匹配。注意：这里是网关收到的原始 path（StripPrefix 之前）
    white-list:
      - /health/**
      - /api/user/users/register
      - /api/user/users/login
      - /api/user/actuator/**
      - /actuator/**

logging:
  level:
    org.springframework.cloud.gateway: info
    reactor.netty.http.client: info
    com.wang.novachat.gateway.filter: debug
