server:
  port: 8080
  address: 0.0.0.0

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      httpclient:
        streaming-timeout: 30000
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: nova-user
          uri: lb://nova-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2

        - id: nova-chat
          uri: lb://nova-chat
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=2

        - id: nova-chat-websocket
          uri: lb://nova-chat
          predicates:
            - Path=/ws/chat/**

        - id: nova-moment
          uri: lb://nova-moment
          predicates:
            - Path=/api/moment/**
          filters:
            - StripPrefix=2

        - id: nova-ai
          uri: http://129.211.0.210:8000
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2

        - id: swagger-ui-redirect
          uri: http://129.211.0.210:8000
          predicates:
            - Path=/swagger-ui.html
          filters:
            - RedirectTo=302,/webjars/swagger-ui/index.html

        - id: nova-user-api-docs
          uri: lb://nova-user
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user,/v3/api-docs

        - id: nova-chat-api-docs
          uri: lb://nova-chat
          predicates:
            - Path=/v3/api-docs/chat
          filters:
            - RewritePath=/v3/api-docs/chat,/v3/api-docs



nova:
  # JWT 密钥须与 nova-user 一致，否则签名校验通不过
  jwt:
    secret: ${NOVA_JWT_SECRET:nova-chat-jwt-secret-change-me-in-production-2026}
    expire-seconds: 604800
    issuer: nova-chat

  auth:
    enabled: true
    # Ant 路径匹配。注意：这里是网关收到的原始 path（StripPrefix 之前）
    white-list:
      - /health/**
      - /api/user/users/register
      - /api/user/users/login
      - /api/user/actuator/**
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**
      - /ws/**

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    use-root-path: true
    enabled: true
    path: /swagger-ui
    urls:
      - url: /v3/api-docs/user
        name: 用户服务
      - url: /v3/api-docs/chat
        name: 聊天服务

logging:
  level:
    org.springframework.cloud.gateway: info
    reactor.netty.http.client: info
    com.wang.novachat.gateway.filter: debug
