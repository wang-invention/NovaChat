server:
  port: 8081
  address: 0.0.0.0

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://129.211.0.210:3307/nova_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 'mysql_pYDshf'
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 10000
      pool-name: NovaUserHikari
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null
  mapper-locations: classpath*:/mapper/**/*.xml

nova:
  jwt:
    secret: ${NOVA_JWT_SECRET:nova-chat-jwt-secret-change-me-in-production-2026}
    expire-seconds: 604800
    issuer: nova-chat
  login:
    mode: ${NOVA_LOGIN_MODE:single}
    max-devices: ${NOVA_LOGIN_MAX_DEVICES:3}
  minio:
    endpoint: ${NOVA_MINIO_ENDPOINT:http://129.211.0.210:9000}
    access-key: ${NOVA_MINIO_ACCESS_KEY:admin}
    secret-key: ${NOVA_MINIO_SECRET_KEY:12345678}
    bucket: ${NOVA_MINIO_BUCKET:nova-chat}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.wang.novachat: debug
    com.wang.novachat.user.mapper: debug

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  packages-to-scan: com.wang.novachat.user.controller
  servers:
    - url: http://129.211.0.210:8080/api/user
      description: 网关公网地址
